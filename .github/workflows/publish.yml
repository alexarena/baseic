name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing requires npm >= 11.5.1; Node 22 LTS still ships
      # with npm 10.x, so bump it explicitly.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      # No NODE_AUTH_TOKEN — npm detects the GitHub OIDC environment and
      # exchanges the workflow's id-token with the registry directly.
      # Each workspace package needs its own trusted publisher entry on npm.
      - name: Publish @baseic/sql
        run: npm publish --workspace=@baseic/sql --access public --provenance
